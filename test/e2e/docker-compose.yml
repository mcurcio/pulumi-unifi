# Tier-2 live e2e: a REAL UniFi OS Server controller serving the official
# Integration API, restored from a committed seed snapshot. This is the only tier
# that proves what the stateless Prism mock (Tier-1) structurally cannot — real
# X-API-Key auth, real decode of live data, and a true create→read→update→delete
# round-trip with persisted state.
#
# WHY THE HEAVY IMAGE (and not a plain Network-app container): the Integration API
# is architecturally coupled to UniFi OS. The standalone Network app does NOT
# serve it — it returns 403 `api.forbidden` on every request, on a mode that never
# even opens the dedicated integration endpoint. Authorization is delegated to
# UniFi OS's `unifi-core` (validates the key in Postgres, injects trusted headers
# via an nginx auth_request). Only the full UniFi OS image carries both halves, so
# it is the only thing that can authenticate the Integration API. (Verified
# empirically — see test/e2e/README.md "Why the heavy image".)
#
# CONSEQUENCE: this stack needs systemd (PID 1) + caps + a host cgroup mount, so
# it is an OFFLINE / local tier — NOT stock GitHub CI. That tradeoff is accepted
# in exchange for a genuine live round-trip. Tier-1 (`make test`, `make test-mock`)
# remains the portable, zero-privilege gate.
#
# Two flows drive this file (see README.md):
#   - make e2e-bootstrap : ONE-TIME — boot BLANK (see mint/), complete the wizard +
#     mint a key by hand, then snapshot the uos_data volume into unifi-seed.tgz.
#   - make test-e2e      : REPEATABLE — restore.sh loads the seed into a fresh
#     uos_data volume, boots this stack, and runs the live Go tests on :11443.
services:
  uos:
    # Community repackage of Ubiquiti's UniFi OS Server installer (bundles UniFi
    # Network 10.4.57 in UniFi OS 5.1.15). PINNED BY DIGEST (pin-and-verify ethos,
    # cf. openapi/fetch.sh) so the restored volume's Postgres/Mongo data always
    # matches the exact DB versions that wrote it. Re-pin on a version bump.
    image: hieutq/unifi-os-server@sha256:3e8854769d634ed5b7b4610b187479226fb8f47178552d1764b1b1db68c8621e
    # Full UniFi OS = systemd PID 1 managing ~10 services (unifi-core, Postgres,
    # Mongo, nginx, the Network app, rabbitmq…). These privileges are the price of
    # the only image that authenticates the Integration API. This is why the tier
    # is offline/local, not CI.
    cgroup: host
    cap_drop: [ALL]
    cap_add:
      - SYS_ADMIN
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - CHOWN
      - SETUID
      - SETGID
      - KILL
      - SYS_CHROOT
      - SYS_PTRACE
      - SYS_RESOURCE
      - AUDIT_WRITE
      - MKNOD
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    volumes:
      # ALL persistent state lives here: /data is a symlink to /unifi/data, so
      # Mongo (/unifi/db), Postgres (/unifi/data/postgresql — holds the api_key
      # secret) and configs are all in this one volume. restore.sh recreates it
      # from the seed before `up`, so the minted key validates on boot.
      - uos_data:/unifi
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    ports:
      - "11443:443"   # UniFi OS edge → Integration API at /proxy/network/integration/v1/...
    healthcheck:
      # Ready when the Integration API answers TLS (401 without a key is fine — it
      # means the edge + unifi-core + Network app are all up and routing).
      test: ["CMD", "sh", "-c", "curl -ksf -o /dev/null -w '%{http_code}' https://localhost:443/proxy/network/integration/v1/sites | grep -qE '200|401|403'"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 240s

volumes:
  uos_data:
