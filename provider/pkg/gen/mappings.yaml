# mappings.yaml — the editorial api→pulumi mapping layer, as DATA.
#
# This file is the single, reviewable, version-controlled source of truth for the
# editorial decisions that stabilize the public Pulumi surface across UniFi API
# spec versions (see docs/reviews/MAPPING-LAYER.md). The gen passes
# (pass_*.go) are a generic, spec-version-agnostic engine; this file holds the
# *opinions*. The engine derives a sensible default from the spec wherever it can;
# this file pins/overrides by exception. Nothing here is Go code.
#
# It is //go:embed-ed into the gen binary (loader: mappings.go), so it travels
# with the build the same way the three generated artifacts travel with the
# plugin. Editing it changes the generated schema/metadata — review the
# testdata/tokens.txt golden diff after any change.
#
# Contract: an entity/token that this engine cannot derive cleanly AND has no
# entry here fails the build LOUD ("unmapped entity") rather than shipping a
# silently-wrong public name.

# excludedPaths lists endpoints that are not clean CRUD resources (RPC-style
# "actions", list "ordering" mutations, and read-only sub-resource lookups).
# Feeding them to the auto-grouper produces junk resources, so they are dropped.
# A dead entry (a path no longer in the spec) is a loud error — see drift_test.go
# (TestExcludedPathsResolve). This list grows empirically as codegen output is
# inspected.
excludedPaths:
  - /v1/sites/{siteId}/acl-rules/ordering
  - /v1/sites/{siteId}/firewall/policies/ordering
  - /v1/sites/{siteId}/clients/{clientId}/actions
  - /v1/sites/{siteId}/devices/{deviceId}/actions
  - /v1/sites/{siteId}/devices/{deviceId}/interfaces/ports/{portIdx}/actions
  - /v1/sites/{siteId}/devices/{deviceId}/statistics/latest
  - /v1/sites/{siteId}/networks/{networkId}/references

# resources holds the per-entity resource-naming editorial layer.
#
# entityPrefixes maps a discriminated entity's collection (create) path to the
# PascalCase prefix its variant resource tokens get. pulschema splits each
# oneOf+discriminator body into one resource per variant, naming each token
# ToPascalCase(discriminatorValue) — bare, context-free (Standard, Mac, Gateway,
# ARecord). The prefix restores entity context (WifiBroadcastStandard, DnsARecord,
# ManagedNetworkGateway, TrafficMatchIpv4Addresses). Keyed by the spec collection
# path so it cannot silently bind to the wrong entity; the engine additionally
# verifies the collection POST genuinely carries a discriminator before applying
# (a stale/misapplied prefix is a loud error). These are entity-meaningful names
# that path-segment derivation alone cannot produce (e.g. /networks →
# ManagedNetwork not Network; /dns/policies → Dns not DnsPolicy; acl-rules and
# traffic-matching-lists both → TrafficMatch).
resources:
  entityPrefixes:
    /v1/sites/{siteId}/dns/policies: Dns
    /v1/sites/{siteId}/wifi/broadcasts: WifiBroadcast
    /v1/sites/{siteId}/networks: ManagedNetwork
    /v1/sites/{siteId}/acl-rules: TrafficMatch
    /v1/sites/{siteId}/traffic-matching-lists: TrafficMatch

# functions holds the function-token normalization editorial layer. The engine
# derives the bulk mechanically (strip Integration/Dto, PascalCase snake
# fragments, fix singulars); these tables pin the cases a mechanical rule cannot
# get right.
functions:
  # acronymFixups normalizes all-caps path/operationId acronym fragments to their
  # PascalCase form when splitting snake_case function tokens.
  acronymFixups:
    VPN: Vpn

  # irregularSingulars fixes the naive trailing-"s" stripping that produced broken
  # singulars (Countrie/Categorie/Policie). Matched as a token suffix so it works
  # inside a compound name (DpiApplicationCategorie → …Category).
  irregularSingulars:
    Countrie: Country
    Categorie: Category
    Policie: Policy

  # explicitRenames settles the near-duplicate get/list pairs that a mechanical
  # rule cannot disambiguate: the verb (get-one vs list-many) is wrong in the
  # source operationId, and the singular/plural entity differs. Kept explicit
  # because these are genuinely irregular (the spec mislabels a get-one as `list`).
  explicitRenames:
    listTrafficMatching: getTrafficMatchingList # get-one (R = …/{id})
    listTrafficMatchings: listTrafficMatchingLists # list-all
    getFirewallPolicie: listFirewallPolicies # list-all (counterpart of getFirewallPolicy)

# descriptions pins the resource/function top-level Description where the
# synthesized text (the spec operation summary, or an entity+verb template) is not
# good enough. The engine (pass_descriptions.go) synthesizes a default for EVERY
# resource and function; these overrides are by-exception, keyed by the final
# (post-rename, post-depage) token short name.
#
# The discriminated-variant resources all share one collection summary ("Create
# DNS Policy", "Create Network", …) that cannot distinguish A_RECORD from
# AAAA_RECORD, so each variant gets a precise description here. Voucher and
# AdoptDevice are batch/action RPCs masquerading as CRUD (D-M3.3) — their
# descriptions state that honestly so the non-declarative semantics are documented
# rather than hidden.
descriptions:
  resources:
    # DNS record variants (collection summary "Create DNS Policy" is ambiguous).
    DnsARecord: An A DNS record (maps a domain to an IPv4 address) managed via the UniFi DNS policy API.
    DnsAaaaRecord: An AAAA DNS record (maps a domain to an IPv6 address) managed via the UniFi DNS policy API.
    DnsCnameRecord: A CNAME DNS record (aliases one domain to another) managed via the UniFi DNS policy API.
    DnsMxRecord: An MX DNS record (mail exchanger) managed via the UniFi DNS policy API.
    DnsSrvRecord: An SRV DNS record (service location) managed via the UniFi DNS policy API.
    DnsTxtRecord: A TXT DNS record (free-form text) managed via the UniFi DNS policy API.
    DnsForwardDomain: A DNS forward-domain policy (forwards a domain to an upstream resolver) on UniFi.
    # WiFi broadcast variants (collection summary "Create Wifi Broadcast").
    WifiBroadcastStandard: A standard-profile WiFi network broadcast (SSID) on UniFi.
    WifiBroadcastIotOptimized: An IoT-optimized WiFi network broadcast (SSID) on UniFi.
    # Managed network variants (collection summary "Create Network").
    ManagedNetworkGateway: A gateway-managed UniFi network (the gateway routes this network).
    ManagedNetworkSwitch: A switch-managed UniFi network (managed at the switch layer).
    ManagedNetworkUnmanaged: An unmanaged UniFi network (UniFi does not manage routing/switching).
    # Traffic-match variants (collection summaries "Create ACL Rule" / "Create Traffic Matching List").
    TrafficMatchMac: A MAC-address traffic-matching ACL rule on UniFi.
    TrafficMatchIpv4: An IPv4 traffic-matching ACL rule on UniFi.
    TrafficMatchIpv4Addresses: An IPv4-addresses traffic-matching list on UniFi.
    TrafficMatchIpv6Addresses: An IPv6-addresses traffic-matching list on UniFi.
    TrafficMatchPorts: A ports traffic-matching list on UniFi.
    # Batch/action RPCs modeled as resources (D-M3.3) — documented honestly.
    Voucher: "Generates a batch of UniFi hotspot guest vouchers. NOTE: this is a batch-generate action, not a declarative resource: `count` controls how many vouchers are created at once and the generated codes are returned as outputs; updating `count` does not reconcile an existing batch and `pulumi destroy` revokes the generated vouchers. Treat each apply as a one-shot generation."
    AdoptDevice: "Adopts UniFi device(s) into the site. NOTE: this is an imperative action, not a declarative resource: it triggers device adoption by MAC address; there is no in-place update, and `pulumi destroy` unadopts (removes) the device. Models the official API's POST /devices adopt action."

# enums pins the canonical NAME for a merged enum family (pass_enum.go, D-M2.7).
# pulschema emits one enum type per operation/variant the spec duplicates, so the
# same closed value set surfaces under several tokens (ACLRuleAction /
# ACLRuleObjectAction / ACLRuleUpdateAction = ["ALLOW","BLOCK"]; ConnectionState…
# vs FirewallPolicyConnectionState…; IpsecFilter vs FirewallPolicyIpsecFilter; …).
# The engine merges every family that shares a module + underlying type + value
# set into ONE type and rewrites all refs. The canonical name is editorial: the
# engine derives a default (the shortest member's short name; ties → alphabetical)
# and these entries pin the exceptions where that default is too generic. Keyed by
# the engine's derived default short name → the chosen short name (kept in-module).
#
# Numeric-enum preservation (broadcastingFrequenciesGHz etc., 03-F9) is OUT OF
# SCOPE here — deferred upstream to pulschema numeric-enum support (G-U3).
enums:
  canonicalRename:
    # The 10-value device adoption/connection-state enum's shortest member is the
    # bare `State` — too generic/collision-prone for a public type. Pin to a
    # descriptive name.
    State: DeviceState
    # The TCP/UDP protocol-filter enum's shortest member is the awkward
    # `Ipv4PropertiesProtocolFilterItem` (the other candidate is worse:
    # GetIntegrationIpAclRuleDtoPropertiesProtocolFilterItem). Pin to the neutral
    # entity-free name.
    Ipv4PropertiesProtocolFilterItem: ProtocolFilterItem

# immutableFields pins the by-exception immutable resource inputs that the engine
# (pass_replace_on_changes.go, D-M3.1) cannot derive from the spec, so changing one
# forces a replace instead of an in-place update the API would reject or silently
# drop (review 01-H2). The engine ALSO derives immutability automatically — every
# spec `readOnly` property and every discriminated-variant's discriminator const
# (type / management, pinned by D-M2.1) is marked replace without an entry here. This
# list is only the spec-implicit pins a rule cannot see.
#
# Listed as bare SDK property names: the engine marks the field on EVERY resource
# that actually has an input property of that name (derive-by-default, pin-by-
# exception). A name no resource carries is a loud error (dead pin — see
# pass_replace_on_changes_test.go), so it cannot silently rot across a spec bump.
#
# siteId is DELIBERATELY ABSENT: its fate (honored per-resource vs removed) and its
# replace semantics are owned by D-M3.2, not this pass.
immutableFields:
  # A network's VLAN ID is identity: the API treats a VLAN change as a different
  # network, not an in-place edit. Present only on the ManagedNetwork* variants.
  - vlanId
